<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bo Earrings</title>
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bo Earrings">
    <meta name="theme-color" content="#f6efe7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #f6efe7; color: #2b2622; }
        .serif { font-family: 'Fraunces', Georgia, serif; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .fadeIn { animation: fadeIn .22s ease; }
        html { -webkit-text-size-adjust: 100%; }
        .card-img { background: #ece3d8; }
        .chip { border: 1px solid #e2d6c8; background: #fffaf4; }
        .chip-on { background: #2b2622; color: #fffaf4; border-color: #2b2622; }
        .sheet { max-height: 92vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            var root = document.getElementById('root');
            if (root && !root.innerHTML.trim()) {
                root.innerHTML = '<div style="padding:32px;font-family:system-ui;max-width:600px;margin:0 auto;">' +
                    '<h2 style="color:#dc2626;">Something went wrong</h2>' +
                    '<p style="color:#666;">The app failed to load. Error details:</p>' +
                    '<pre style="background:#fef2f2;padding:16px;border-radius:8px;overflow:auto;font-size:13px;color:#991b1b;">' +
                    msg + (line ? '\\nLine: ' + line : '') + (col ? ', Col: ' + col : '') +
                    (error && error.stack ? '\\n\\n' + error.stack : '') + '</pre></div>';
            }
        };
        if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
    </script>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ============ CONFIG ============
        const APP_VERSION = 'v1.0.2-nov15';
        // Dedicated Firebase project for Bo Earrings (auth gate + Realtime Database storage).
        // Paste the web-app config from Firebase console → Project settings → Your apps.
        // While apiKey is still "PASTE_ME", the app runs in LOCAL MODE (no sign-in, edits saved in this browser only).
        const FB_CONFIG = {
            apiKey: "AIzaSyDSA0pihxlPrBDFk64z3ZVjFmGhoucK0hc",
            authDomain: "bo-earrings.firebaseapp.com",
            databaseURL: "https://bo-earrings-default-rtdb.firebaseio.com",
            projectId: "bo-earrings",
            storageBucket: "bo-earrings.firebasestorage.app",
            messagingSenderId: "809412661793",
            appId: "1:809412661793:web:f8cfe850899d476d2fc960"
        };
        const CLOUD = FB_CONFIG.apiKey && FB_CONFIG.apiKey !== 'PASTE_ME';
        let auth = null, db = null;
        if (CLOUD) { firebase.initializeApp(FB_CONFIG); auth = firebase.auth(); db = firebase.database(); }
        const DB_ROOT = 'boEarrings';          // everything lives under this node
        const ALLOWED_EMAILS = ['taly.matiteyahu@gmail.com', 'doug.pickard@gmail.com'];
        const LS_CACHE = 'bo_ear_cache_v1';    // offline mirror of cloud data / local-mode store
        const DRIVE_FOLDER = 'https://drive.google.com/drive/folders/1wlBAU3dX_HQh_G5iX8KlJNFEP-4wcPy2';

        // ============ VOCAB ============
        // Color families: search "red" finds burgundy, maroon, wine…; swatch chips filter by family.
        const COLOR_FAMILIES = [
            { key: 'red',    hex: '#c0392b', members: ['red','dark red','burgundy','maroon','wine','berry'] },
            { key: 'pink',   hex: '#e58fb1', members: ['pink','light pink','magenta','rose','mauve','berry','peach','fuchsia'] },
            { key: 'orange', hex: '#e67e22', members: ['orange','rust','peach','amber','coral'] },
            { key: 'yellow', hex: '#f1c40f', members: ['yellow','amber','mustard'] },
            { key: 'green',  hex: '#3f8f4f', members: ['green','dark green','olive','sage','mint','grey green','emerald'] },
            { key: 'teal',   hex: '#1f9a99', members: ['teal','dark teal','turquoise','aqua'] },
            { key: 'blue',   hex: '#2f63b8', members: ['blue','light blue','navy','cobalt','royal blue','dark blue','periwinkle','slate','turquoise'] },
            { key: 'purple', hex: '#7d4bb0', members: ['purple','lavender','plum','mauve','periwinkle','violet'] },
            { key: 'brown',  hex: '#8a5a3b', members: ['brown','tan','taupe','beige','bronze'] },
            { key: 'black',  hex: '#1d1d1d', members: ['black','gunmetal'] },
            { key: 'white',  hex: '#fbfaf7', members: ['white','cream','clear','beige','ivory'] },
            { key: 'grey',   hex: '#9aa0a6', members: ['grey','gray','light grey','slate','gunmetal'] },
            { key: 'gold',   hex: '#c9a227', members: ['gold','brass','bronze'] },
            { key: 'silver', hex: 'linear-gradient(135deg,#eceff1,#9ea7ad)', members: ['silver'] },
            { key: 'copper', hex: '#b8693a', members: ['copper','rose gold','rust'] },
            { key: 'multi',  hex: 'conic-gradient(#e74c3c,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c)', members: ['multicolor','rainbow','iridescent','abalone'] },
        ];
        const MATERIAL_GROUPS = [
            { key: 'Metal',            words: ['silver','sterling','gold','brass','bronze','copper','aluminum','pewter','metal','steel','wire','vermeil','chain','titanium'] },
            { key: 'Stone & crystal',  words: ['stone','agate','jasper','quartz','crystal','howlite','jade','onyx','turquoise','lapis','lava','geode','druzy','tiger eye','sodalite','carnelian','magnesite','amber','hematite','zoisite','lepidolite','coral','rhinestone','swarovski','zoisite'] },
            { key: 'Glass',            words: ['glass','dichroic','lampwork','murano'] },
            { key: 'Wood & nut',       words: ['wood','tagua','yosegi','vegetable ivory','olive'] },
            { key: 'Clay & ceramic',   words: ['clay','ceramic','porcelain'] },
            { key: 'Resin & enamel',   words: ['resin','acrylic','lacquer','enamel'] },
            { key: 'Shell & pearl',    words: ['shell','pearl','abalone','wampum','cowrie'] },
            { key: 'Fabric, leather & paper', words: ['fabric','textile','leather','paper','washi','origami','macramé','cord','thread','silk','sequin','woven','flowers'] },
        ];
        const STYLE_GROUPS = [
            { key: 'Drop',        words: ['drop'] },
            { key: 'Dangle',      words: ['dangle','chandelier','cascade'] },
            { key: 'Hoop',        words: ['hoop'] },
            { key: 'Threader',    words: ['threader'] },
            { key: 'Stud / post', words: ['post','stud','clip-on'] },
            { key: 'Statement',   words: ['statement'] },
            { key: 'Geometric',   words: ['geometric'] },
            { key: 'Cluster / fringe', words: ['cluster','fringe','cascade'] },
            { key: 'Beaded',      words: ['beaded'] },
            { key: 'Long',        words: ['long','linear','tiered'] },
        ];
        const SYNONYMS = {
            gray: 'grey', studs: 'post', stud: 'post', dangly: 'dangle', dangles: 'dangle', wooden: 'wood', ceramics: 'ceramic',
            hoops: 'hoop', drops: 'drop', beads: 'bead', pearls: 'pearl', shells: 'shell', stones: 'stone', crystals: 'crystal',
            leaves: 'leaf', triangles: 'triangle', circles: 'circle', flowers: 'flower', feathers: 'feather', spirals: 'spiral',
            multicolored: 'multi', colorful: 'multi', rainbow: 'multi', gifts: 'gift', nyc: 'new york', clay: 'clay',
        };
        const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        // ============ HELPERS ============
        const lc = s => (s || '').toString().toLowerCase();
        const famOfColor = c => COLOR_FAMILIES.filter(f => f.members.includes(lc(c))).map(f => f.key);
        const familiesOf = item => Array.from(new Set((item.colors || []).flatMap(famOfColor)));
        const groupHit = (groups, key, list) => { const g = groups.find(x => x.key === key); return !!g && (list || []).some(v => g.words.some(w => lc(v).includes(w))); };
        const fmtDate = d => { if (!d) return ''; const [y, m] = d.split('-'); return m ? `${MONTHS[+m - 1].slice(0,3)} ${y}` : y; };
        const swatchStyle = hex => ({ background: hex });
        const driveSearch = item => item.sourceFile ? `https://drive.google.com/drive/search?q=${encodeURIComponent('"' + item.sourceFile.replace(/\.(jpe?g|heic|pdf)$/i, '') + '"')}` : DRIVE_FOLDER;
        const uid = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const splitList = s => (s || '').split(',').map(x => x.trim()).filter(Boolean);

        function haystack(item) {
            return lc([item.title, item.place, item.trip, item.region, item.intl ? 'international abroad' : 'usa america united states',
                item.year, fmtDate(item.date), item.date && MONTHS[+item.date.split('-')[1] - 1],
                (item.colors || []).join(' '), familiesOf(item).join(' '), (item.materials || []).join(' '),
                (item.styles || []).join(' '), (item.tags || []).join(' '), item.gift ? 'gift present' : '', item.notes].join(' | '));
        }
        function termHits(item, hay, raw) {
            let t = lc(raw).trim(); if (!t) return true;
            t = SYNONYMS[t] || t;
            const fam = COLOR_FAMILIES.find(f => f.key === t);
            if (fam) return familiesOf(item).includes(fam.key);
            if (hay.includes(t)) return true;
            if (t.length > 3 && t.endsWith('s') && hay.includes(t.slice(0, -1))) return true;
            return false;
        }
        // "red / pink" or "red or pink" = either. "blue wood" = both. Multi-word phrases ("cape cod") match as a phrase first.
        function matches(item, query) {
            const q = lc(query).trim(); if (!q) return true;
            const hay = haystack(item);
            const ors = q.split(/\s*(?:\/|\bor\b|,|\|)\s*/).filter(Boolean);
            return ors.some(group => hay.includes(group) || group.split(/\s+/).every(w => termHits(item, hay, w)));
        }

        function compressImage(file, max = 720) {
            return new Promise((resolve, reject) => {
                const img = new Image(); const url = URL.createObjectURL(file);
                img.onload = () => {
                    const s = Math.min(1, max / Math.max(img.width, img.height));
                    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
                    resolve(c.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = () => reject(new Error("Couldn't read that image (HEIC? try a screenshot or JPG)"));
                img.src = url;
            });
        }

        // ============ STORE (cloud or local) ============
        function useStore(authState) {
            const [remote, setRemote] = useState(() => { try { return JSON.parse(localStorage.getItem(LS_CACHE)) || {}; } catch { return {}; } });
            const [synced, setSynced] = useState(!CLOUD);
            const [syncErr, setSyncErr] = useState('');
            useEffect(() => {
                if (!CLOUD || authState !== 'in') return;
                const ref = db.ref(DB_ROOT);
                // photos are big — subscribe to everything except /photos, load photos lazily
                const keys = ['overrides', 'added', 'favorites', 'hidden'];
                const offs = keys.map(k => {
                    const r = ref.child(k);
                    const h = r.on('value', snap => {
                        setRemote(prev => { const next = { ...prev, [k]: snap.val() || {} }; try { localStorage.setItem(LS_CACHE, JSON.stringify(next)); } catch {} return next; });
                        setSynced(true);
                    }, err => { setSyncErr(err.message || 'sync error'); setSynced(true); });
                    return () => r.off('value', h);
                });
                return () => offs.forEach(f => f());
            }, [authState]);
            const write = (path, val) => {
                if (CLOUD) return db.ref(DB_ROOT + '/' + path).set(val === undefined ? null : val);
                setRemote(prev => {
                    const next = JSON.parse(JSON.stringify(prev)); const parts = path.split('/'); let o = next;
                    parts.slice(0, -1).forEach(p => { o[p] = o[p] || {}; o = o[p]; });
                    if (val === null || val === undefined) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = val;
                    try { localStorage.setItem(LS_CACHE, JSON.stringify(next)); } catch (e) { alert('Local storage is full — connect Firebase to save more photos.'); }
                    return next;
                });
                return Promise.resolve();
            };
            return { remote, synced, syncErr, write };
        }
        function usePhoto(item, remote) {
            const [src, setSrc] = useState(null);
            useEffect(() => {
                if (!item) return;
                if (!item.custom) { setSrc('img/' + item.id + '.jpg'); return; }
                if (!CLOUD) { setSrc((remote.photos || {})[item.id] || null); return; }
                let alive = true; const cacheKey = 'bo_ear_ph_' + item.id;
                const cached = sessionStorage.getItem(cacheKey); if (cached) { setSrc(cached); return; }
                db.ref(DB_ROOT + '/photos/' + item.id).once('value').then(s => { if (!alive) return; const v = s.val(); setSrc(v); try { sessionStorage.setItem(cacheKey, v); } catch {} });
                return () => { alive = false; };
            }, [item && item.id, remote.photos]);
            return src;
        }

        // ============ UI ============
        function SignIn({ error }) {
            const signIn = () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(e => { if (e.code === 'auth/popup-blocked') auth.signInWithRedirect(provider); });
            };
            return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="text-center max-w-xs">
                        <img src="icon.png" className="w-24 h-24 mx-auto rounded-3xl shadow-sm" />
                        <h1 className="serif text-3xl mt-5">Bo Earrings</h1>
                        <p className="text-stone-500 mt-2 text-sm">Every pair, and where it came from.</p>
                        {error && <p className="text-red-600 text-sm mt-4">{error}</p>}
                        <button onClick={signIn} className="mt-8 w-full py-3 rounded-xl bg-stone-900 text-white font-semibold shadow-sm">Sign in with Google</button>
                        <p className="text-stone-400 text-xs mt-10">{APP_VERSION}</p>
                    </div>
                </div>
            );
        }

        function Thumb({ item, remote, onClick, fav }) {
            const src = usePhoto(item, remote);
            return (
                <button onClick={onClick} className="text-left group fadeIn">
                    <div className="card-img relative aspect-[4/5] rounded-2xl overflow-hidden">
                        {src ? <img src={src} loading="lazy" className="w-full h-full object-cover group-hover:scale-[1.03] transition duration-300" /> : <div className="w-full h-full animate-pulse" />}
                        {fav && <span className="absolute top-2 right-2 text-base drop-shadow">♥</span>}
                        <div className="absolute bottom-2 left-2 flex -space-x-1">
                            {familiesOf(item).slice(0, 5).map(f => <span key={f} className="w-3.5 h-3.5 rounded-full ring-2 ring-white/80" style={swatchStyle(COLOR_FAMILIES.find(c => c.key === f).hex)} />)}
                        </div>
                    </div>
                    <div className="mt-2 px-0.5">
                        <div className="text-[13px] font-medium leading-snug line-clamp-2">{item.title}</div>
                        <div className="text-[12px] text-stone-500 mt-0.5 truncate">{item.place} · {fmtDate(item.date)}</div>
                    </div>
                </button>
            );
        }

        function Chip({ on, onClick, children, title }) {
            return <button title={title} onClick={onClick} className={`chip ${on ? 'chip-on' : ''} whitespace-nowrap px-3 py-1.5 rounded-full text-[13px] transition`}>{children}</button>;
        }

        function TagLink({ children, onClick }) {
            return <button onClick={onClick} className="chip px-2.5 py-1 rounded-full text-[12px] hover:bg-stone-900 hover:text-white transition">{children}</button>;
        }

        function Detail({ item, remote, fav, onClose, onFav, onEdit, onSearch }) {
            const src = usePhoto(item, remote);
            const [zoom, setZoom] = useState(false);
            const Row = ({ label, list, search }) => list && list.length ? (
                <div className="mt-4">
                    <div className="text-[11px] uppercase tracking-wider text-stone-400 mb-1.5">{label}</div>
                    <div className="flex flex-wrap gap-1.5">{list.map(v => <TagLink key={v} onClick={() => onSearch(search ? search(v) : v)}>{v}</TagLink>)}</div>
                </div>) : null;
            return (
                <div className="fixed inset-0 z-40 bg-black/40 flex items-end sm:items-center justify-center" onClick={onClose}>
                    <div className="sheet bg-[#fffaf4] w-full sm:max-w-3xl sm:rounded-3xl rounded-t-3xl overflow-y-auto fadeIn" onClick={e => e.stopPropagation()}>
                        <div className="sm:flex">
                            <div className="sm:w-1/2 card-img relative cursor-zoom-in" onClick={() => setZoom(true)}>
                                {src && <img src={src} className="w-full h-full max-h-[55vh] sm:max-h-none object-contain sm:object-cover" />}
                                <button onClick={e => { e.stopPropagation(); onClose(); }} className="absolute top-3 left-3 w-9 h-9 rounded-full bg-white/90 shadow text-lg sm:hidden">×</button>
                            </div>
                            <div className="sm:w-1/2 p-5 sm:p-6">
                                <div className="flex items-start gap-3">
                                    <h2 className="serif text-2xl leading-tight flex-1">{item.title}</h2>
                                    <button onClick={onFav} className={`text-2xl ${fav ? 'text-rose-600' : 'text-stone-300'}`} title="Favorite">♥</button>
                                    <button onClick={onClose} className="hidden sm:block text-2xl text-stone-400">×</button>
                                </div>
                                <button onClick={() => onSearch(item.place)} className="mt-2 text-[15px] text-stone-700 hover:underline text-left">📍 {item.place}</button>
                                <div className="text-sm text-stone-500 mt-1">{fmtDate(item.date)}{item.region && item.region !== item.place ? ` · ${item.region}` : ''}{item.gift ? ' · 🎁 gift' : ''}</div>
                                {item.trip && <button onClick={() => onSearch(item.trip)} className="text-xs text-stone-400 mt-1 hover:underline text-left">From photo “{item.trip}”{item.sourcePage ? ` (page ${item.sourcePage})` : ''}</button>}
                                <div className="mt-4 flex flex-wrap gap-1.5">
                                    {familiesOf(item).map(f => (
                                        <button key={f} onClick={() => onSearch(f)} className="chip flex items-center gap-1.5 pl-1.5 pr-2.5 py-1 rounded-full text-[12px]">
                                            <span className="w-3.5 h-3.5 rounded-full border border-black/10" style={swatchStyle(COLOR_FAMILIES.find(c => c.key === f).hex)} />{f}
                                        </button>))}
                                </div>
                                <Row label="Exact colors" list={item.colors} />
                                <Row label="Materials" list={item.materials} />
                                <Row label="Style" list={item.styles} />
                                <Row label="Details & maker" list={item.tags} />
                                {item.notes && <p className="mt-4 text-sm text-stone-600 whitespace-pre-wrap">{item.notes}</p>}
                                <div className="mt-6 flex flex-wrap gap-2">
                                    <button onClick={onEdit} className="px-4 py-2 rounded-xl bg-stone-900 text-white text-sm font-medium">Edit labels</button>
                                    <a href={item.custom ? DRIVE_FOLDER : driveSearch(item)} target="_blank" className="px-4 py-2 rounded-xl chip text-sm">Original photo in Drive ↗</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    {zoom && src && <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center" onClick={e => { e.stopPropagation(); setZoom(false); }}><img src={src} className="max-w-full max-h-full object-contain" /></div>}
                </div>
            );
        }

        function Editor({ item, onSave, onCancel, onDelete }) {
            const isNew = !item;
            const [f, setF] = useState(() => item ? {
                title: item.title || '', place: item.place || '', date: item.date || '', region: item.region || '',
                colors: (item.colors || []).join(', '), materials: (item.materials || []).join(', '), styles: (item.styles || []).join(', '),
                tags: (item.tags || []).join(', '), notes: item.notes || '', gift: !!item.gift,
            } : { title: '', place: '', date: new Date().toISOString().slice(0, 7), region: '', colors: '', materials: '', styles: '', tags: '', notes: '', gift: false });
            const [photo, setPhoto] = useState(null);
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');
            const set = k => e => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
            const addColor = c => { const l = splitList(f.colors); if (!l.includes(c)) setF({ ...f, colors: [...l, c].join(', ') }); };
            const pick = async e => { const file = e.target.files[0]; if (!file) return; try { setPhoto(await compressImage(file)); setErr(''); } catch (x) { setErr(x.message); } };
            const save = async () => {
                if (isNew && !photo) { setErr('Add a photo first'); return; }
                if (!f.title.trim()) { setErr('Give it a short name'); return; }
                setBusy(true);
                const out = { title: f.title.trim(), place: f.place.trim(), date: f.date, year: parseInt(f.date) || null, region: f.region.trim() || f.place.trim(),
                    colors: splitList(f.colors).map(lc), materials: splitList(f.materials), styles: splitList(f.styles), tags: splitList(f.tags), notes: f.notes, gift: f.gift };
                try { await onSave(out, photo); } catch (x) { setErr(x.message || 'Save failed'); setBusy(false); }
            };
            const Field = ({ k, label, ph, area }) => (
                <label className="block mt-3">
                    <span className="text-[11px] uppercase tracking-wider text-stone-400">{label}</span>
                    {area ? <textarea value={f[k]} onChange={set(k)} placeholder={ph} rows={3} className="mt-1 w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm" />
                          : <input value={f[k]} onChange={set(k)} placeholder={ph} className="mt-1 w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm" />}
                </label>);
            return (
                <div className="fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onClick={onCancel}>
                    <div className="sheet bg-[#fffaf4] w-full sm:max-w-lg sm:rounded-3xl rounded-t-3xl overflow-y-auto p-5 sm:p-6 fadeIn" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center"><h2 className="serif text-2xl flex-1">{isNew ? 'Add a pair' : 'Edit labels'}</h2><button onClick={onCancel} className="text-2xl text-stone-400">×</button></div>
                        {isNew && (
                            <label className="mt-4 block card-img rounded-2xl overflow-hidden cursor-pointer">
                                {photo ? <img src={photo} className="w-full max-h-72 object-contain" /> : <div className="h-40 flex items-center justify-center text-stone-500 text-sm">📷 Tap to add a photo of one pair</div>}
                                <input type="file" accept="image/*" className="hidden" onChange={pick} />
                            </label>)}
                        {Field({ k: 'title', label: 'Name', ph: 'e.g. Blue glass teardrops' })}
                        <div className="grid grid-cols-2 gap-3">
                            {Field({ k: 'place', label: 'Where you got them', ph: 'e.g. Kyoto' })}
                            {Field({ k: 'date', label: 'When (YYYY-MM)', ph: '2026-05' })}
                        </div>
                        {Field({ k: 'region', label: 'Country / state', ph: 'e.g. Japan, New York' })}
                        {Field({ k: 'colors', label: 'Colors (comma separated)', ph: 'blue, gold' })}
                        <div className="flex flex-wrap gap-1.5 mt-2">
                            {COLOR_FAMILIES.map(c => <button key={c.key} title={c.key} onClick={() => addColor(c.key === 'multi' ? 'multicolor' : c.key)} className="w-6 h-6 rounded-full border border-black/10" style={swatchStyle(c.hex)} />)}
                        </div>
                        {Field({ k: 'materials', label: 'Materials', ph: 'glass, silver' })}
                        {Field({ k: 'styles', label: 'Style', ph: 'drop, statement, geometric' })}
                        {Field({ k: 'tags', label: 'Details, shapes, maker', ph: 'teardrop, leaf, Shop Name' })}
                        {Field({ k: 'notes', label: 'Notes', ph: 'Story, shop, price…', area: true })}
                        <label className="flex items-center gap-2 mt-3 text-sm"><input type="checkbox" checked={f.gift} onChange={set('gift')} /> This was a gift</label>
                        {err && <p className="text-red-600 text-sm mt-3">{err}</p>}
                        <div className="mt-5 flex gap-2">
                            <button disabled={busy} onClick={save} className="flex-1 py-3 rounded-xl bg-stone-900 text-white font-semibold disabled:opacity-50">{busy ? 'Saving…' : 'Save'}</button>
                            {!isNew && <button onClick={onDelete} className="px-4 py-3 rounded-xl chip text-sm text-red-700">Hide</button>}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [authState, setAuthState] = useState(CLOUD ? 'loading' : 'in');
            const [authError, setAuthError] = useState('');
            const [user, setUser] = useState(null);
            const [seed, setSeed] = useState(null);
            const [q, setQ] = useState('');
            const [fColors, setFColors] = useState([]);
            const [fMat, setFMat] = useState('');
            const [fStyle, setFStyle] = useState('');
            const [fRegion, setFRegion] = useState('');
            const [fFav, setFFav] = useState(false);
            const [sort, setSort] = useState('new');
            const [view, setView] = useState('grid');
            const [openId, setOpenId] = useState(null);
            const [editing, setEditing] = useState(null);   // item | 'new' | null
            const [showMore, setShowMore] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);
            const { remote, synced, syncErr, write } = useStore(authState);

            useEffect(() => {
                if (!CLOUD) return;
                auth.getRedirectResult().catch(() => {});
                return auth.onAuthStateChanged(u => {
                    if (u && ALLOWED_EMAILS.includes((u.email || '').toLowerCase())) { setUser(u); setAuthState('in'); }
                    else if (u) { setAuthError(`${u.email} isn't on the allow-list.`); auth.signOut(); setAuthState('denied'); }
                    else setAuthState('denied');
                });
            }, []);
            useEffect(() => { const k = e => { if (e.key === 'Escape') { setEditing(null); setOpenId(null); setMenuOpen(false); } }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
            useEffect(() => { fetch('earrings.json', { cache: 'no-cache' }).then(r => r.json()).then(d => setSeed(d.items)).catch(() => setSeed([])); }, []);

            const items = useMemo(() => {
                if (!seed) return [];
                const ov = remote.overrides || {}, hid = remote.hidden || {};
                const base = seed.map(it => ov[it.id] ? { ...it, ...ov[it.id] } : it);
                const added = Object.entries(remote.added || {}).map(([id, v]) => ({ ...v, id, custom: true }));
                return [...base, ...added].filter(it => !hid[it.id]);
            }, [seed, remote]);
            const favs = remote.favorites || {};
            const regions = useMemo(() => {
                const m = {}; items.forEach(i => { m[i.region] = (m[i.region] || 0) + 1; });
                return Object.entries(m).sort((a, b) => b[1] - a[1]);
            }, [items]);

            const shown = useMemo(() => {
                let l = items.filter(i => matches(i, q));
                if (fColors.length) l = l.filter(i => { const fam = familiesOf(i); return fColors.some(c => fam.includes(c)); });
                if (fMat) l = l.filter(i => groupHit(MATERIAL_GROUPS, fMat, i.materials));
                if (fStyle) l = l.filter(i => groupHit(STYLE_GROUPS, fStyle, i.styles));
                if (fRegion) l = l.filter(i => i.region === fRegion);
                if (fFav) l = l.filter(i => favs[i.id]);
                const by = { new: (a, b) => (b.date || '').localeCompare(a.date || '') || a.id.localeCompare(b.id),
                             old: (a, b) => (a.date || '').localeCompare(b.date || '') || a.id.localeCompare(b.id),
                             place: (a, b) => (a.region || '').localeCompare(b.region || '') || (a.place || '').localeCompare(b.place || '') };
                return [...l].sort(by[sort]);
            }, [items, q, fColors, fMat, fStyle, fRegion, fFav, sort, favs]);

            const groups = useMemo(() => {
                const m = new Map();
                shown.forEach(i => { const k = sort === 'place' ? i.region : (i.trip || i.place); if (!m.has(k)) m.set(k, []); m.get(k).push(i); });
                return [...m.entries()];
            }, [shown, sort]);

            if (CLOUD && authState === 'loading') return <div className="min-h-screen flex items-center justify-center text-stone-400">Loading…</div>;
            if (authState !== 'in') return <SignIn error={authError} />;

            const anyFilter = q || fColors.length || fMat || fStyle || fRegion || fFav;
            const clearAll = () => { setQ(''); setFColors([]); setFMat(''); setFStyle(''); setFRegion(''); setFFav(false); };
            const searchFor = s => { clearAll(); setQ(s); setOpenId(null); window.scrollTo({ top: 0, behavior: 'smooth' }); };
            const open = items.find(i => i.id === openId);
            const toggleColor = k => setFColors(fColors.includes(k) ? fColors.filter(x => x !== k) : [...fColors, k]);

            const saveItem = async (data, photo) => {
                if (editing === 'new') {
                    const id = uid();
                    if (photo) await write('photos/' + id, photo);
                    await write('added/' + id, { ...data, addedAt: new Date().toISOString(), addedBy: user ? user.email : 'local' });
                    setEditing(null); setOpenId(id);
                } else {
                    const it = editing;
                    await write((it.custom ? 'added/' : 'overrides/') + it.id, it.custom ? { ...remote.added[it.id], ...data } : data);
                    setEditing(null);
                }
            };
            const hideItem = async it => { if (!confirm('Hide this pair from the index? (You can restore it from the menu.)')) return; await write('hidden/' + it.id, true); setEditing(null); setOpenId(null); };
            const hiddenCount = Object.keys(remote.hidden || {}).length;

            return (
                <div className="min-h-screen pb-24">
                    {!CLOUD && <div className="bg-amber-100 text-amber-900 text-[12px] text-center py-1.5 px-3">Local mode — Firebase isn't connected yet, so edits only save in this browser.</div>}
                    <header className="sticky top-0 z-30 bg-[#f6efe7]/95 backdrop-blur border-b border-[#eadfd2]">
                        <div className="max-w-6xl mx-auto px-4 pt-4 pb-3">
                            <div className="flex items-center gap-3">
                                <img src="icon.png" className="w-9 h-9 rounded-xl" />
                                <h1 className="serif text-2xl flex-1">Bo Earrings <span className="text-stone-400 text-base font-normal">{items.length}</span></h1>
                                <button onClick={() => setEditing('new')} className="px-3.5 py-2 rounded-xl bg-stone-900 text-white text-sm font-medium">+ Add</button>
                                <div className="relative">
                                    <button onClick={() => setMenuOpen(!menuOpen)} className="w-9 h-9 rounded-xl chip text-lg leading-none">⋯</button>
                                    {menuOpen && (
                                        <div className="absolute right-0 mt-2 w-60 bg-white rounded-xl shadow-lg border border-stone-100 py-1 text-sm z-40" onClick={() => setMenuOpen(false)}>
                                            <a href={DRIVE_FOLDER} target="_blank" className="block px-3 py-2 hover:bg-stone-50">Open Earrings folder in Drive ↗</a>
                                            {hiddenCount > 0 && <button onClick={() => { if (confirm(`Restore ${hiddenCount} hidden pair(s)?`)) write('hidden', null); }} className="block w-full text-left px-3 py-2 hover:bg-stone-50">Restore hidden ({hiddenCount})</button>}
                                            {CLOUD && <button onClick={() => auth.signOut()} className="block w-full text-left px-3 py-2 hover:bg-stone-50">Sign out {user && `(${user.email.split('@')[0]})`}</button>}
                                            <div className="px-3 py-2 text-stone-400 text-xs">{APP_VERSION} · {!CLOUD ? 'local mode' : syncErr ? '⚠ ' + syncErr : synced ? '☁ synced' : 'connecting…'}</div>
                                        </div>)}
                                </div>
                            </div>
                            <div className="mt-3 relative">
                                <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search — try “red / pink”, “wood”, “Japan”, “hoops”, “2024”"
                                    className="w-full rounded-2xl bg-white border border-[#e2d6c8] pl-10 pr-10 py-3 text-[15px] outline-none focus:ring-2 focus:ring-stone-300" />
                                <span className="absolute left-3.5 top-3 text-stone-400">⌕</span>
                                {q && <button onClick={() => setQ('')} className="absolute right-3 top-2.5 text-stone-400 text-xl">×</button>}
                            </div>
                            <div className="mt-3 flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                                {COLOR_FAMILIES.map(c => (
                                    <button key={c.key} title={c.key} onClick={() => toggleColor(c.key)}
                                        className={`shrink-0 flex items-center gap-1.5 rounded-full pl-1 pr-2.5 py-1 text-[12px] transition ${fColors.includes(c.key) ? 'bg-stone-900 text-white' : 'chip'}`}>
                                        <span className="w-5 h-5 rounded-full border border-black/10" style={swatchStyle(c.hex)} />{c.key}
                                    </button>))}
                            </div>
                            <div className="mt-2 flex gap-1.5 overflow-x-auto no-scrollbar items-center">
                                <Chip on={showMore || fMat || fStyle || fRegion} onClick={() => setShowMore(!showMore)}>Filters {(fMat || fStyle || fRegion) ? '•' : ''} {showMore ? '▴' : '▾'}</Chip>
                                <Chip on={fFav} onClick={() => setFFav(!fFav)}>♥ Favorites</Chip>
                                <Chip on={view === 'grid'} onClick={() => setView('grid')}>Grid</Chip>
                                <Chip on={view === 'groups'} onClick={() => setView('groups')}>By trip</Chip>
                                <select value={sort} onChange={e => setSort(e.target.value)} className="chip rounded-full px-3 py-1.5 text-[13px]">
                                    <option value="new">Newest first</option><option value="old">Oldest first</option><option value="place">By place</option>
                                </select>
                                {anyFilter ? <button onClick={clearAll} className="text-[13px] text-stone-500 underline whitespace-nowrap px-2">Clear</button> : null}
                            </div>
                            {showMore && (
                                <div className="mt-3 space-y-2 fadeIn">
                                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar"><span className="text-[11px] uppercase tracking-wider text-stone-400 self-center w-16 shrink-0">Material</span>
                                        {MATERIAL_GROUPS.map(g => <Chip key={g.key} on={fMat === g.key} onClick={() => setFMat(fMat === g.key ? '' : g.key)}>{g.key}</Chip>)}</div>
                                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar"><span className="text-[11px] uppercase tracking-wider text-stone-400 self-center w-16 shrink-0">Style</span>
                                        {STYLE_GROUPS.map(g => <Chip key={g.key} on={fStyle === g.key} onClick={() => setFStyle(fStyle === g.key ? '' : g.key)}>{g.key}</Chip>)}</div>
                                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar"><span className="text-[11px] uppercase tracking-wider text-stone-400 self-center w-16 shrink-0">Where</span>
                                        {regions.map(([r, n]) => <Chip key={r} on={fRegion === r} onClick={() => setFRegion(fRegion === r ? '' : r)}>{r} <span className="opacity-50">{n}</span></Chip>)}</div>
                                </div>)}
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 pt-4">
                        {!seed ? <div className="text-center text-stone-400 py-20">Loading your collection…</div> :
                         shown.length === 0 ? (
                            <div className="text-center py-20">
                                <div className="serif text-xl">No pairs match</div>
                                <p className="text-stone-500 text-sm mt-2">Try fewer words, or “/” for either: <i>red / pink</i></p>
                                <button onClick={clearAll} className="mt-4 px-4 py-2 rounded-xl chip text-sm">Clear search</button>
                            </div>) :
                         view === 'grid' ? (
                            <>
                                {anyFilter && <div className="text-sm text-stone-500 mb-3">{shown.length} {shown.length === 1 ? 'pair' : 'pairs'}</div>}
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-3 gap-y-5">
                                    {shown.map(i => <Thumb key={i.id} item={i} remote={remote} fav={favs[i.id]} onClick={() => setOpenId(i.id)} />)}
                                </div>
                            </>) : (
                            <div className="space-y-8">
                                {groups.map(([k, list]) => (
                                    <section key={k}>
                                        <div className="flex items-baseline gap-2 mb-2">
                                            <h3 className="serif text-lg">{sort === 'place' ? k : k.replace(/^[\d.\s-]+-\s*/, '')}</h3>
                                            <span className="text-xs text-stone-400">{sort === 'place' ? `${list.length} pairs` : fmtDate(list[0].date)}</span>
                                        </div>
                                        <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                                            {list.map(i => <div key={i.id} className="w-36 sm:w-44 shrink-0"><Thumb item={i} remote={remote} fav={favs[i.id]} onClick={() => setOpenId(i.id)} /></div>)}
                                        </div>
                                    </section>))}
                            </div>)}
                    </main>

                    {open && <Detail item={open} remote={remote} fav={!!favs[open.id]} onClose={() => setOpenId(null)}
                        onFav={() => write('favorites/' + open.id, favs[open.id] ? null : true)}
                        onEdit={() => setEditing(open)} onSearch={searchFor} />}
                    {editing && <Editor item={editing === 'new' ? null : editing} onCancel={() => setEditing(null)} onSave={saveItem} onDelete={() => hideItem(editing)} />}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
